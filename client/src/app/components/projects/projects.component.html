<div class="container">
  <div class="flex-between mb-2">
    <h1 class="page-title">My Projects</h1>
    <button class="btn btn-primary" routerLink="/projects/new">+ New Project</button>
  </div>

  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading projects...</p>
  </div>

  <div class="alert alert-error" *ngIf="error">{{ error }}</div>

  <div class="projects-grid" *ngIf="!loading && projects.length > 0">
    <div class="project-card card" *ngFor="let project of projects">
      <h3 class="project-title" (click)="viewProject(project._id)">{{ project.name }}</h3>
      <p class="project-description">{{ project.description || 'No description' }}</p>
      <div class="project-meta">
        <small>Created: {{ project.createdAt | date:'short' }}</small>
      </div>
      <div class="project-actions">
        <button class="btn btn-primary" (click)="viewProject(project._id)">View Details</button>
        <button class="btn btn-danger" (click)="deleteProject(project._id, $event)">Delete</button>
      </div>
    </div>
  </div>

  <div class="empty-state card" *ngIf="!loading && projects.length === 0">
    <div class="empty-icon">📁</div>
    <h2>No Projects Yet</h2>
    <p>Create your first project to get started</p>
    <button class="btn btn-primary" routerLink="/projects/new">Create Project</button>
  </div>
</div>
